<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>往生堂 · 第七十五代堂主 · 胡桃</title>
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@300;400;600&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --crimson: #8B2323;
            --amber: #C4A35A;
            --gold: #D4AF37;
            --dark-amber: #8B6914;
            --ink: #1A1A1A;
            --mist: rgba(200, 180, 160, 0.3);
            --paper: #F5F0E8;
            --blood-moon: #6B1C1C;
        }

        body {
            min-height: 100vh;
            background: var(--paper);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            font-family: 'Noto Serif SC', serif;
        }

        .poster-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        .paper-texture {
            position: absolute;
            inset: 0;
            background: 
                url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
            opacity: 0.08;
            pointer-events: none;
            z-index: 100;
        }

        .watercolor-bg {
            position: absolute;
            inset: 0;
            background: 
                radial-gradient(ellipse 80% 60% at 30% 40%, rgba(139, 35, 35, 0.12) 0%, transparent 50%),
                radial-gradient(ellipse 60% 80% at 70% 60%, rgba(196, 163, 90, 0.15) 0%, transparent 45%),
                radial-gradient(ellipse 100% 100% at 50% 50%, rgba(212, 175, 55, 0.08) 0%, transparent 60%),
                linear-gradient(160deg, #F8F4EC 0%, #EDE5D8 50%, #E8DFD0 100%);
            z-index: 1;
        }

        .fog-layer {
            position: absolute;
            inset: 0;
            background: 
                radial-gradient(ellipse 120% 40% at 20% 80%, rgba(255, 252, 245, 0.9) 0%, transparent 70%),
                radial-gradient(ellipse 80% 50% at 80% 20%, rgba(230, 220, 200, 0.7) 0%, transparent 60%);
            z-index: 50;
            animation: fogDrift 20s ease-in-out infinite;
        }

        @keyframes fogDrift {
            0%, 100% { opacity: 1; transform: translateX(0); }
            50% { opacity: 0.85; transform: translateX(20px); }
        }

        .silhouette-container {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: min(85vw, 700px);
            height: min(95vh, 900px);
            z-index: 10;
        }

        .silhouette-svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 20px 60px rgba(107, 28, 28, 0.25));
        }

        .silhouette-mask {
            fill: url(#silhouetteGradient);
            transition: all 1s ease;
        }

        .interior-world {
            position: absolute;
            inset: 0;
            overflow: hidden;
            clip-path: url(#silhouetteClip);
        }

        .world-elements {
            position: absolute;
            inset: -5%;
            animation: worldPulse 8s ease-in-out infinite;
        }

        @keyframes worldPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        .element {
            position: absolute;
            opacity: 0;
            animation: elementReveal 3s ease forwards;
        }

        @keyframes elementReveal {
            0% { opacity: 0; transform: scale(0.8) translateY(20px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        .moon {
            width: 18%;
            top: 8%;
            left: 50%;
            transform: translateX(-50%);
            animation-delay: 0.5s;
        }

        .moon circle {
            fill: url(#moonGradient);
            filter: blur(0.5px);
        }

        .mount-tianheng {
            width: 70%;
            bottom: 15%;
            left: 15%;
            animation-delay: 0.8s;
        }

        .mount-tianheng path {
            fill: url(#mountainGradient);
            opacity: 0.7;
        }

        .wangsheng-building {
            width: 45%;
            bottom: 25%;
            right: 10%;
            animation-delay: 1.2s;
        }

        . lanterns-row {
            width: 60%;
            top: 20%;
            left: 20%;
            animation-delay: 1.5s;
        }

        .lantern {
            position: absolute;
            animation: lanternFloat 4s ease-in-out infinite;
        }

        @keyframes lanternFloat {
            0%, 100% { transform: translateY(0) rotate(-2deg); }
            50% { transform: translateY(-8px) rotate(2deg); }
        }

        .spider-lily {
            width: 12%;
            bottom: 35%;
            left: 25%;
            animation-delay: 1.8s;
        }

        .butterfly {
            width: 8%;
            top: 35%;
            left: 40%;
            animation-delay: 2s;
            animation: butterflyFloat 6s ease-in-out infinite;
        }

        @keyframes butterflyFloat {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(15px, -20px) rotate(10deg); }
            50% { transform: translate(30px, 0) rotate(-5deg); }
            75% { transform: translate(15px, 20px) rotate(5deg); }
        }

        .paralysis-aura {
            width: 25%;
            top: 40%;
            left: 30%;
            animation-delay: 2.2s;
        }

        .paralysis-aura circle {
            fill: none;
            stroke: var(--crimson);
            stroke-width: 0.5;
            opacity: 0.4;
        }

        .zhongli-element {
            width: 15%;
            top: 25%;
            right: 25%;
            animation-delay: 2.5s;
        }

        .adepti-symbol {
            width: 20%;
            bottom: 40%;
            left: 15%;
            animation-delay: 2.8s;
        }

        .ritual-scroll {
            width: 30%;
            bottom: 20%;
            left: 20%;
            animation-delay: 3s;
        }

        .ember-particles {
            position: absolute;
            inset: 0;
            overflow: hidden;
        }

        .ember {
            position: absolute;
            width: 4px;
            height: 4px;
            background: radial-gradient(circle, var(--amber) 0%, transparent 70%);
            border-radius: 50%;
            animation: emberRise 8s ease-in infinite;
        }

        @keyframes emberRise {
            0% { 
                transform: translateY(0) translateX(0) scale(1);
                opacity: 0;
            }
            10% { opacity: 0.8; }
            90% { opacity: 0.3; }
            100% { 
                transform: translateY(-400px) translateX(50px) scale(0);
                opacity: 0;
            }
        }

        .character-relation {
            width: 18%;
            top: 50%;
            right: 20%;
            animation-delay: 3.3s;
        }

        .text-overlay {
            position: absolute;
            inset: 0;
            z-index: 60;
            pointer-events: none;
        }

        .title-main {
            position: absolute;
            top: 8%;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            opacity: 0;
            animation: titleReveal 2s ease forwards 1s;
        }

        @keyframes titleReveal {
            0% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
            100% { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        .title-main h1 {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: clamp(3rem, 8vw, 6rem);
            color: var(--crimson);
            letter-spacing: 0.3em;
            text-shadow: 
                2px 4px 8px rgba(107, 28, 28, 0.15),
                0 0 40px rgba(196, 163, 90, 0.2);
            margin-bottom: 0.5rem;
        }

        .title-main .subtitle {
            font-family: 'ZCOOL XiaoWei', serif;
            font-size: clamp(0.9rem, 2vw, 1.4rem);
            color: var(--dark-amber);
            letter-spacing: 0.8em;
            font-weight: 300;
        }

        .poem-section {
            position: absolute;
            bottom: 8%;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            opacity: 0;
            animation: poemReveal 2s ease forwards 1.5s;
        }

        @keyframes poemReveal {
            0% { opacity: 0; transform: translateX(-50%) translateY(20px); }
            100% { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        .poem {
            font-family: 'Noto Serif SC', serif;
            font-size: clamp(0.75rem, 1.5vw, 1.1rem);
            color: rgba(107, 28, 28, 0.7);
            line-height: 2.2;
            letter-spacing: 0.2em;
            font-weight: 300;
        }

        .poem-line {
            display: block;
        }

        .side-text {
            position: absolute;
            writing-mode: vertical-rl;
            font-family: 'Noto Serif SC', serif;
            font-size: 0.7rem;
            color: rgba(139, 105, 20, 0.5);
            letter-spacing: 0.5em;
            opacity: 0;
            animation: sideTextReveal 1.5s ease forwards 2s;
        }

        @keyframes sideTextReveal {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        .side-text.left {
            left: 3%;
            top: 50%;
            transform: translateY(-50%);
        }

        .side-text.right {
            right: 3%;
            top: 50%;
            transform: translateY(-50%) rotate(180deg);
        }

        .corner-ornament {
            position: absolute;
            width: 80px;
            height: 80px;
            opacity: 0;
            animation: ornamentReveal 1.5s ease forwards 2.5s;
        }

        @keyframes ornamentReveal {
            0% { opacity: 0; transform: scale(0.8); }
            100% { opacity: 0.6; transform: scale(1); }
        }

        .corner-ornament.top-left {
            top: 20px;
            left: 20px;
        }

        .corner-ornament.top-right {
            top: 20px;
            right: 20px;
            transform: rotate(90deg);
        }

        .corner-ornament.bottom-left {
            bottom: 20px;
            left: 20px;
            transform: rotate(-90deg);
        }

        .corner-ornament.bottom-right {
            bottom: 20px;
            right: 20px;
            transform: rotate(180deg);
        }

        .seal {
            position: absolute;
            bottom: 12%;
            right: 8%;
            width: 60px;
            height: 60px;
            opacity: 0;
            animation: sealReveal 1s ease forwards 3s;
        }

        @keyframes sealReveal {
            0% { opacity: 0; transform: scale(1.2) rotate(-10deg); }
            100% { opacity: 0.8; transform: scale(1) rotate(0deg); }
        }

        .seal rect {
            fill: var(--crimson);
            opacity: 0.85;
        }

        .seal text {
            fill: var(--paper);
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 28px;
        }

        .brush-stroke {
            position: absolute;
            background: linear-gradient(90deg, transparent, var(--crimson), transparent);
            height: 1px;
            opacity: 0.3;
        }

        .brush-stroke.horizontal {
            width: 30%;
        }

        .brush-stroke.top {
            top: 15%;
            left: 35%;
        }

        .brush-stroke.bottom {
            bottom: 15%;
            right: 35%;
        }

        .vignette {
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse 80% 80% at 50% 50%, transparent 40%, rgba(139, 100, 60, 0.15) 100%);
            pointer-events: none;
            z-index: 55;
        }

        .double-exposure-glow {
            position: absolute;
            inset: 0;
            background: 
                radial-gradient(ellipse 30% 40% at 50% 45%, rgba(212, 175, 55, 0.1) 0%, transparent 60%),
                radial-gradient(ellipse 50% 30% at 50% 60%, rgba(139, 35, 35, 0.08) 0%, transparent 50%);
            mix-blend-mode: screen;
            z-index: 5;
            animation: glowPulse 6s ease-in-out infinite;
        }

        @keyframes glowPulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        .loading-screen {
            position: fixed;
            inset: 0;
            background: var(--paper);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 1.5s ease;
        }

        .loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-text {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 2rem;
            color: var(--crimson);
            letter-spacing: 0.5em;
            animation: loadingPulse 1.5s ease-in-out infinite;
        }

        @keyframes loadingPulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        @media (max-width: 768px) {
            .side-text {
                display: none;
            }
            
            .corner-ornament {
                width: 40px;
                height: 40px;
            }
            
            .seal {
                width: 40px;
                height: 40px;
                bottom: 10%;
                right: 5%;
            }
        }
    </style>
</head>
<body>
    <div class="loading-screen" id="loading">
        <span class="loading-text">往生堂</span>
    </div>

    <div class="poster-container">
        <div class="paper-texture"></div>
        <div class="watercolor-bg"></div>
        <div class="double-exposure-glow"></div>
        <div class="fog-layer"></div>
        
        <svg class="silhouette-container" viewBox="0 0 400 500" preserveAspectRatio="xMidYMid meet">
            <defs>
                <clipPath id="silhouetteClip">
                    <path d="M200,20 
                        C280,25 340,80 350,160
                        C360,240 340,320 310,380
                        C290,420 260,460 200,480
                        C140,460 110,420 90,380
                        C60,320 40,240 50,160
                        C60,80 120,25 200,20
                        Z"/>
                </clipPath>
                
                <linearGradient id="silhouetteGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#1A1A1A"/>
                    <stop offset="50%" style="stop-color:#2D2020"/>
                    <stop offset="100%" style="stop-color:#1A1A1A"/>
                </linearGradient>
                
                <radialGradient id="moonGradient" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" style="stop-color:#FFF8E7"/>
                    <stop offset="70%" style="stop-color:#E8D5B0"/>
                    <stop offset="100%" style="stop-color:#C4A35A;stop-opacity:0"/>
                </radialGradient>
                
                <linearGradient id="mountainGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:#4A3728;stop-opacity:0.6"/>
                    <stop offset="100%" style="stop-color:#2D1F15;stop-opacity:0.9"/>
                </linearGradient>
                
                <linearGradient id="buildingGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#8B4513;stop-opacity:0.7"/>
                    <stop offset="100%" style="stop-color:#5D2E0C;stop-opacity:0.9"/>
                </linearGradient>
                
                <filter id="watercolor" x="-20%" y="-20%" width="140%" height="140%">
                    <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise"/>
                    <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
                </filter>
                
                <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur stdDeviation="3" result="blur"/>
                    <feMerge>
                        <feMergeNode in="blur"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>
            </defs>
            
            <g class="interior-world">
                <g class="world-elements">
                    <!-- 月亮 -->
                    <g class="element moon">
                        <circle cx="0" cy="0" r="25"/>
                    </g>
                    
                    <!-- 轻策庄/山峦 -->
                    <g class="element mount-tianheng" filter="url(#watercolor)">
                        <path d="M-60,30 L-40,-20 L-20,10 L0,-35 L20,5 L40,-25 L60,30 Z"/>
                        <path d="M-50,30 L-30,-5 L-10,15 L10,-15 L30,10 L50,-10 L55,30 Z" opacity="0.5"/>
                    </g>
                    
                    <!-- 往生堂建筑 -->
                    <g class="element wangsheng-building" filter="url(#watercolor)">
                        <path d="M-30,40 L-35,0 L-25,-30 L-15,-25 L0,-40 L15,-25 L25,-30 L35,0 L30,40 Z" fill="url(#buildingGradient)"/>
                        <path d="M-20,40 L-20,10 L20,10 L20,40" fill="none" stroke="#C4A35A" stroke-width="0.5" opacity="0.6"/>
                        <rect x="-5" y="15" width="10" height="25" fill="#2D1F15" opacity="0.8"/>
                    </g>
                    
                    <!-- 霓裳花/彼岸花 -->
                    <g class="element spider-lily" filter="url(#softGlow)">
                        <path d="M0,0 C-5,-8 -10,-12 -8,-18 C-6,-24 0,-22 0,-18 C0,-22 6,-24 8,-18 C10,-12 5,-8 0,0" fill="#6B1C1C" opacity="0.7"/>
                        <path d="M0,0 C5,-6 8,-10 6,-15 C4,-20 0,-18 0,-15 C0,-18 -4,-20 -6,-15 C-8,-10 -5,-6 0,0" fill="#8B2323" opacity="0.5"/>
                        <line x1="0" y1="0" x2="0" y2="15" stroke="#4A3728" stroke-width="1"/>
                    </g>
                    
                    <!-- 蝴蝶 -->
                    <g class="element butterfly" filter="url(#softGlow)">
                        <path d="M0,0 Q-8,-10 -5,-15 Q-2,-18 0,-10 Q2,-18 5,-15 Q8,-10 0,0" fill="rgba(196,163,90,0.6)"/>
                        <path d="M0,0 Q-5,-6 -3,-10 Q-1,-12 0,-6 Q1,-12 3,-10 Q5,-6 0,0" fill="rgba(139,105,20,0.5)"/>
                        <ellipse cx="0" cy="-5" rx="0.5" ry="4" fill="#2D1F15"/>
                    </g>
                    
                    <!-- 往生咒文/符文 -->
                    <g class="element paralysis-aura">
                        <circle cx="0" cy="0" r="20" opacity="0.3"/>
                        <circle cx="0" cy="0" r="30" opacity="0.2"/>
                        <circle cx="0" cy="0" r="40" opacity="0.1"/>
                        <path d="M0,-25 L3,-15 L0,-5 L-3,-15 Z" fill="var(--crimson)" opacity="0.4"/>
                        <path d="M0,25 L3,15 L0,5 L-3,15 Z" fill="var(--crimson)" opacity="0.4"/>
                    </g>
                    
                    <!-- 摩拉克斯/岩元素 -->
                    <g class="element zhongli-element" filter="url(#softGlow)">
                        <polygon points="0,-15 13,7 -13,7" fill="none" stroke="#C4A35A" stroke-width="0.8" opacity="0.5"/>
                        <polygon points="0,15 13,-7 -13,-7" fill="none" stroke="#C4A35A" stroke-width="0.8" opacity="0.5"/>
                        <circle cx="0" cy="0" r="5" fill="#D4AF37" opacity="0.3"/>
                    </g>
                    
                    <!-- 仙兽/鹿 -->
                    <g class="element adepti-symbol">
                        <path d="M-10,10 Q-15,0 -10,-10 L-8,-8 Q-10,-2 -8,8 Z" fill="#5D4E37" opacity="0.4"/>
                        <path d="M-8,0 Q0,-5 8,0" fill="none" stroke="#8B7355" stroke-width="0.5" opacity="0.5"/>
                        <ellipse cx="0" cy="5" rx="6" ry="4" fill="#5D4E37" opacity="0.3"/>
                    </g>
                    
                    <!-- 符箓卷轴 -->
                    <g class="element ritual-scroll">
                        <rect x="-15" y="-20" width="30" height="40" rx="2" fill="none" stroke="#8B6914" stroke-width="0.5" opacity="0.5"/>
                        <line x1="-10" y1="-12" x2="10" y2="-12" stroke="#8B6914" stroke-width="0.3" opacity="0.4"/>
                        <line x1="-10" y1="-4" x2="10" y2="-4" stroke="#8B6914" stroke-width="0.3" opacity="0.4"/>
                        <line x1="-10" y1="4" x2="10" y2="4" stroke="#8B6914" stroke-width="0.3" opacity="0.4"/>
                        <line x1="-10" y1="12" x2="10" y2="12" stroke="#8B6914" stroke-width="0.3" opacity="0.4"/>
                    </g>
                    
                    <!-- 角色关系：钟离 -->
                    <g class="element character-relation" filter="url(#softGlow)">
                        <circle cx="0" cy="-5" r="8" fill="none" stroke="#C4A35A" stroke-width="0.8" opacity="0.4"/>
                        <path d="M-5,5 Q0,0 5,5" fill="none" stroke="#C4A35A" stroke-width="0.5" opacity="0.4"/>
                    </g>
                </g>
                
                <!-- 余烬粒子 -->
                <g class="ember-particles" id="emberContainer"></g>
            </g>
            
            <!-- 主体剪影 -->
            <path class="silhouette-mask" d="M200,20 
                C280,25 340,80 350,160
                C360,240 340,320 310,380
                C290,420 260,460 200,480
                C140,460 110,420 90,380
                C60,320 40,240 50,160
                C60,80 120,25 200,20
                Z"/>
        </svg>

        <div class="text-overlay">
            <div class="title-main">
                <h1>胡桃</h1>
                <div class="subtitle">往生堂第七十五代堂主</div>
            </div>

            <div class="poem-section">
                <p class="poem">
                    <span class="poem-line">彼岸花開引歸途</span>
                    <span class="poem-line">生死輪迴皆有序</span>
                    <span class="poem-line">燃盡此身化灰燼</span>
                    <span class="poem-line">化作長明護迷途</span>
                </p>
            </div>

            <span class="side-text left">生死之事 · 皆有定數</span>
            <span class="side-text right">歸去來兮 · 塵歸塵土歸土</span>

            <svg class="corner-ornament top-left" viewBox="0 0 80 80">
                <path d="M5,40 Q5,5 40,5" fill="none" stroke="var(--crimson)" stroke-width="0.8" opacity="0.5"/>
                <path d="M5,55 Q5,25 25,25 Q25,5 55,5" fill="none" stroke="var(--amber)" stroke-width="0.5" opacity="0.4"/>
                <circle cx="40" cy="5" r="2" fill="var(--crimson)" opacity="0.6"/>
            </svg>
            
            <svg class="corner-ornament top-right" viewBox="0 0 80 80">
                <path d="M5,40 Q5,5 40,5" fill="none" stroke="var(--crimson)" stroke-width="0.8" opacity="0.5"/>
                <path d="M5,55 Q5,25 25,25 Q25,5 55,5" fill="none" stroke="var(--amber)" stroke-width="0.5" opacity="0.4"/>
                <circle cx="40" cy="5" r="2" fill="var(--crimson)" opacity="0.6"/>
            </svg>
            
            <svg class="corner-ornament bottom-left" viewBox="0 0 80 80">
                <path d="M5,40 Q5,5 40,5" fill="none" stroke="var(--crimson)" stroke-width="0.8" opacity="0.5"/>
                <path d="M5,55 Q5,25 25,25 Q25,5 55,5" fill="none" stroke="var(--amber)" stroke-width="0.5" opacity="0.4"/>
                <circle cx="40" cy="5" r="2" fill="var(--crimson)" opacity="0.6"/>
            </svg>
            
            <svg class="corner-ornament bottom-right" viewBox="0 0 80 80">
                <path d="M5,40 Q5,5 40,5" fill="none" stroke="var(--crimson)" stroke-width="0.8" opacity="0.5"/>
                <path d="M5,55 Q5,25 25,25 Q25,5 55,5" fill="none" stroke="var(--amber)" stroke-width="0.5" opacity="0.4"/>
                <circle cx="40" cy="5" r="2" fill="var(--crimson)" opacity="0.6"/>
            </svg>

            <svg class="seal" viewBox="0 0 60 60">
                <rect x="5" y="5" width="50" height="50" rx="3"/>
                <text x="30" y="38" text-anchor="middle">往</text>
            </svg>

            <div class="brush-stroke horizontal top"></div>
            <div class="brush-stroke horizontal bottom"></div>
        </div>

        <div class="vignette"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                document.getElementById('loading').classList.add('hidden');
            }, 1500);

            const emberContainer = document.getElementById('emberContainer');
            const emberCount = 25;

            for (let i = 0; i < emberCount; i++) {
                const ember = document.createElement('div');
                ember.className = 'ember';
                ember.style.left = `${30 + Math.random() * 40}%`;
                ember.style.top = `${40 + Math.random() * 40}%`;
                ember.style.animationDelay = `${Math.random() * 8}s`;
                ember.style.animationDuration = `${6 + Math.random() * 4}s`;
                ember.style.width = `${2 + Math.random() * 4}px`;
                ember.style.height = ember.style.width;
                emberContainer.appendChild(ember);
            }

            const lanternPositions = [
                { x: 20, y: 0, delay: 1.5, size: 12 },
                { x: 35, y: 5, delay: 1.8, size: 10 },
                { x: 55, y: 2, delay: 2.1, size: 14 },
                { x: 70, y: 8, delay: 2.4, size: 11 }
            ];

            lanternPositions.forEach(pos => {
                const lantern = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                lantern.classList.add('element', 'lantern');
                lantern.style.cssText = `
                    left: ${pos.x}%;
                    top: ${pos.y}%;
                    animation-delay: ${pos.delay}s;
                `;
                
                const lanternSVG = `
                    <ellipse cx="0" cy="0" rx="${pos.size * 0.6}" ry="${pos.size}" fill="#8B2323" opacity="0.4"/>
                    <ellipse cx="0" cy="0" rx="${pos.size * 0.4}" ry="${pos.size * 0.7}" fill="#C4A35A" opacity="0.3"/>
                    <line x1="0" y1="${-pos.size}" x2="0" y2="${-pos.size - 5}" stroke="#5D4E37" stroke-width="0.5"/>
                `;
                lantern.innerHTML = lanternSVG;
                
                const worldElements = document.querySelector('.world-elements');
                if (worldElements) {
                    worldElements.appendChild(lantern);
                }
            });

            document.querySelectorAll('.element').forEach((el, i) => {
                el.style.animationDelay = `${0.5 + i * 0.3}s`;
            });

            let ticking = false;
            window.addEventListener('scroll', () => {
                if (!ticking) {
                    window.requestAnimationFrame(() => {
                        const scrolled = window.pageYOffset;
                        const silhouette = document.querySelector('.silhouette-container');
                        if (silhouette) {
                            silhouette.style.transform = `translate(-50%, -50%) translateY(${scrolled * 0.1}px)`;
                        }
                        ticking = false;
                    });
                    ticking = true;
                }
            });
        });
    </script>
</body>
</html>
