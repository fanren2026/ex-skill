<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>往生堂 · 胡桃</title>
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@300;400;600;700&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --crimson: #8B2323;
            --deep-crimson: #6B1C1C;
            --amber: #C4A35A;
            --gold: #D4AF37;
            --dark-amber: #8B6914;
            --ink: #1A1A1A;
            --paper: #F8F4EC;
            --sepia: #704214;
            --blood-red: #A52A2A;
        }

        body {
            min-height: 100vh;
            background: var(--paper);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            font-family: 'Noto Serif SC', serif;
        }

        .poster-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        .paper-texture {
            position: absolute;
            inset: 0;
            background: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='5' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.06;
            pointer-events: none;
            z-index: 100;
        }

        .watercolor-bg {
            position: absolute;
            inset: 0;
            background: 
                radial-gradient(ellipse 70% 80% at 30% 20%, rgba(139, 35, 35, 0.18) 0%, transparent 55%),
                radial-gradient(ellipse 60% 70% at 70% 60%, rgba(196, 163, 90, 0.12) 0%, transparent 50%),
                radial-gradient(ellipse 90% 90% at 50% 50%, rgba(212, 175, 55, 0.06) 0%, transparent 60%),
                linear-gradient(170deg, #FAF6F0 0%, #F0E8DC 30%, #E8DFD0 70%, #E0D5C8 100%);
            z-index: 1;
        }

        .ink-wash {
            position: absolute;
            inset: 0;
            background: 
                radial-gradient(ellipse 50% 60% at 20% 80%, rgba(112, 66, 20, 0.15) 0%, transparent 60%),
                radial-gradient(ellipse 40% 50% at 85% 30%, rgba(139, 35, 35, 0.1) 0%, transparent 50%);
            z-index: 2;
        }

        .fog-layer {
            position: absolute;
            inset: 0;
            background: 
                radial-gradient(ellipse 130% 50% at 20% 70%, rgba(255, 252, 248, 0.95) 0%, transparent 75%),
                radial-gradient(ellipse 90% 60% at 80% 25%, rgba(240, 230, 215, 0.8) 0%, transparent 65%);
            z-index: 50;
            animation: fogDrift 25s ease-in-out infinite;
        }

        @keyframes fogDrift {
            0%, 100% { opacity: 1; transform: translateX(0) translateY(0); }
            50% { opacity: 0.9; transform: translateX(30px) translateY(-10px); }
        }

        .silhouette-container {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: min(80vw, 650px);
            height: min(92vh, 900px);
            z-index: 10;
        }

        .silhouette-svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 30px 80px rgba(107, 28, 28, 0.3));
        }

        .interior-world {
            position: absolute;
            inset: 0;
            overflow: hidden;
            clip-path: url(#silhouetteClip);
        }

        .world-elements {
            position: absolute;
            inset: -10%;
            animation: worldPulse 10s ease-in-out infinite;
        }

        @keyframes worldPulse {
            0%, 100% { transform: scale(1); opacity: 0.95; }
            50% { transform: scale(1.02); opacity: 1; }
        }

        .element {
            position: absolute;
            opacity: 0;
            animation: elementReveal 3.5s ease forwards;
        }

        @keyframes elementReveal {
            0% { opacity: 0; transform: scale(0.75) translateY(30px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        .blood-moon {
            width: 22%;
            top: 12%;
            right: 25%;
            animation-delay: 0.3s;
        }

        .blood-moon circle {
            fill: url(#moonGradient);
            filter: url(#softGlow);
        }

        .wangsheng-temple {
            width: 55%;
            bottom: 35%;
            right: 5%;
            animation-delay: 0.8s;
        }

        .wangsheng-temple path {
            fill: url(#templeGradient);
        }

        .wangsheng-temple .glow {
            fill: rgba(212, 175, 55, 0.4);
        }

        .hutao-figure {
            width: 35%;
            bottom: 40%;
            left: 35%;
            animation-delay: 1.3s;
        }

        .ghost-spirit {
            width: 18%;
            top: 45%;
            right: 15%;
            animation-delay: 1.8s;
        }

        .ghost-spirit ellipse {
            fill: url(#ghostGradient);
        }

        .spider-lilies {
            width: 85%;
            bottom: 5%;
            left: 8%;
            animation-delay: 2.2s;
        }

        .butterfly-large {
            width: 12%;
            top: 25%;
            left: 20%;
            animation-delay: 2.5s;
        }

        .butterfly-large path {
            fill: url(#butterflyGradient);
        }

        .lanterns-group {
            width: 70%;
            top: 18%;
            left: 15%;
            animation-delay: 2.8s;
        }

        .lantern-individual {
            position: absolute;
            animation: lanternFloat 5s ease-in-out infinite;
        }

        .lantern-individual circle {
            fill: url(#lanternGradient);
        }

        @keyframes lanternFloat {
            0%, 100% { transform: translateY(0) rotate(-3deg); }
            50% { transform: translateY(-12px) rotate(3deg); }
        }

        .gravestone {
            width: 15%;
            bottom: 8%;
            left: 35%;
            animation-delay: 3.2s;
        }

        .gravestone rect {
            fill: url(#stoneGradient);
        }

        .figures-silhouette {
            width: 40%;
            bottom: 10%;
            left: 50%;
            animation-delay: 3.5s;
        }

        .cherry-blossoms {
            width: 30%;
            top: 8%;
            right: 8%;
            animation-delay: 3.8s;
        }

        .cherry-blossom {
            position: absolute;
            animation: petalFloat 8s ease-in-out infinite;
        }

        @keyframes petalFloat {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(8px, 15px) rotate(15deg); }
            50% { transform: translate(15px, 25px) rotate(30deg); }
            75% { transform: translate(8px, 35px) rotate(15deg); }
        }

        .embers-container {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .ember {
            position: absolute;
            width: 3px;
            height: 3px;
            background: radial-gradient(circle, var(--amber) 0%, rgba(196, 163, 90, 0.5) 50%, transparent 70%);
            border-radius: 50%;
            animation: emberRise 10s ease-in infinite;
        }

        @keyframes emberRise {
            0% { 
                transform: translateY(0) translateX(0) scale(1);
                opacity: 0;
            }
            10% { opacity: 0.9; }
            90% { opacity: 0.2; }
            100% { 
                transform: translateY(-500px) translateX(60px) scale(0);
                opacity: 0;
            }
        }

        .text-overlay {
            position: absolute;
            inset: 0;
            z-index: 60;
            pointer-events: none;
        }

        .title-vertical {
            position: absolute;
            top: 15%;
            left: 5%;
            writing-mode: vertical-rl;
            text-align: center;
            opacity: 0;
            animation: titleReveal 2s ease forwards 1s;
        }

        @keyframes titleReveal {
            0% { opacity: 0; transform: translateY(-20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .title-vertical h1 {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: clamp(2.5rem, 7vw, 5rem);
            color: var(--crimson);
            letter-spacing: 0.2em;
            text-shadow: 2px 3px 6px rgba(107, 28, 28, 0.15);
            margin-bottom: 1rem;
            line-height: 1.2;
        }

        .title-vertical .subtitle {
            font-family: 'Noto Serif SC', serif;
            font-size: clamp(0.75rem, 1.8vw, 1.2rem);
            color: var(--sepia);
            letter-spacing: 0.6em;
            font-weight: 400;
            margin-bottom: 1rem;
        }

        .title-seal {
            width: 45px;
            height: 45px;
            margin-left: auto;
            margin-right: auto;
        }

        .title-seal rect {
            fill: var(--crimson);
            opacity: 0.9;
        }

        .title-seal text {
            fill: var(--paper);
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 20px;
        }

        .poem-vertical {
            position: absolute;
            right: 5%;
            top: 35%;
            writing-mode: vertical-rl;
            text-align: center;
            opacity: 0;
            animation: poemReveal 2s ease forwards 1.8s;
        }

        @keyframes poemReveal {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .poem-text {
            font-family: 'Noto Serif SC', serif;
            font-size: clamp(0.65rem, 1.2vw, 0.95rem);
            color: rgba(107, 28, 28, 0.65);
            line-height: 2.5;
            letter-spacing: 0.3em;
            font-weight: 300;
        }

        .poem-line {
            display: block;
        }

        .footer-info {
            position: absolute;
            bottom: 5%;
            left: 5%;
            opacity: 0;
            animation: footerReveal 1.5s ease forwards 2.5s;
        }

        @keyframes footerReveal {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .footer-info .vision-icon {
            width: 40px;
            height: 40px;
            margin-bottom: 0.5rem;
        }

        .footer-info .vision-icon path {
            fill: url(#pyroGradient);
        }

        .footer-info .name {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 1.2rem;
            color: var(--crimson);
            letter-spacing: 0.3em;
            margin-bottom: 0.2rem;
        }

        .footer-info .subname {
            font-family: 'Noto Serif SC', serif;
            font-size: 0.65rem;
            color: rgba(139, 105, 20, 0.7);
            letter-spacing: 0.2em;
            font-weight: 300;
        }

        .footer-seal {
            position: absolute;
            bottom: 5%;
            right: 5%;
            width: 35px;
            height: 35px;
            opacity: 0;
            animation: sealReveal 1s ease forwards 3s;
        }

        @keyframes sealReveal {
            0% { opacity: 0; transform: scale(1.3) rotate(-15deg); }
            100% { opacity: 0.7; transform: scale(1) rotate(0deg); }
        }

        .footer-seal rect {
            fill: var(--crimson);
            opacity: 0.85;
        }

        .footer-seal text {
            fill: var(--paper);
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 18px;
        }

        .vignette {
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse 75% 85% at 50% 50%, transparent 35%, rgba(139, 100, 60, 0.18) 100%);
            pointer-events: none;
            z-index: 55;
        }

        .double-exposure-layer {
            position: absolute;
            inset: 0;
            background: 
                radial-gradient(ellipse 40% 50% at 55% 40%, rgba(212, 175, 55, 0.08) 0%, transparent 65%),
                radial-gradient(ellipse 60% 40% at 45% 60%, rgba(139, 35, 35, 0.06) 0%, transparent 55%);
            mix-blend-mode: screen;
            z-index: 5;
            animation: glowPulse 8s ease-in-out infinite;
        }

        @keyframes glowPulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 0.8; }
        }

        .brush-stroke-left {
            position: absolute;
            left: 0;
            top: 30%;
            width: 80px;
            height: 300px;
            background: linear-gradient(to right, rgba(139, 35, 35, 0.1), transparent);
            clip-path: polygon(0 0, 100% 10%, 100% 90%, 0 100%);
            opacity: 0.4;
        }

        .brush-stroke-right {
            position: absolute;
            right: 0;
            top: 40%;
            width: 60px;
            height: 250px;
            background: linear-gradient(to left, rgba(139, 35, 35, 0.08), transparent);
            clip-path: polygon(0 10%, 100% 0, 100% 100%, 0 90%);
            opacity: 0.3;
        }

        .loading-screen {
            position: fixed;
            inset: 0;
            background: var(--paper);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 1.8s ease;
        }

        .loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-text {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 2.5rem;
            color: var(--crimson);
            letter-spacing: 0.6em;
            animation: loadingPulse 2s ease-in-out infinite;
        }

        @keyframes loadingPulse {
            0%, 100% { opacity: 0.4; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.02); }
        }

        @media (max-width: 768px) {
            .poem-vertical {
                right: 3%;
                top: 40%;
            }
            
            .title-vertical {
                left: 3%;
                top: 12%;
            }
            
            .footer-info {
                left: 3%;
                bottom: 3%;
            }
            
            .footer-seal {
                right: 3%;
                bottom: 3%;
                width: 25px;
                height: 25px;
            }
            
            .brush-stroke-left,
            .brush-stroke-right {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="loading-screen" id="loading">
        <span class="loading-text">往生堂</span>
    </div>

    <div class="poster-container">
        <div class="paper-texture"></div>
        <div class="watercolor-bg"></div>
        <div class="ink-wash"></div>
        <div class="double-exposure-layer"></div>
        <div class="fog-layer"></div>
        
        <svg class="silhouette-container" viewBox="0 0 400 550" preserveAspectRatio="xMidYMid meet">
            <defs>
                <clipPath id="silhouetteClip">
                    <path d="M200,30
                        C260,35 320,80 340,150
                        C355,220 345,290 325,350
                        C310,390 290,430 260,470
                        C230,500 200,520 200,530
                        C200,520 170,500 140,470
                        C110,430 90,390 75,350
                        C55,290 45,220 60,150
                        C80,80 140,35 200,30
                        Z"/>
                </clipPath>

                <radialGradient id="moonGradient" cx="40%" cy="40%" r="50%">
                    <stop offset="0%" style="stop-color:#C44536"/>
                    <stop offset="50%" style="stop-color:#8B2323"/>
                    <stop offset="100%" style="stop-color:#6B1C1C;stop-opacity:0"/>
                </radialGradient>

                <linearGradient id="templeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#5D2E0C"/>
                    <stop offset="50%" style="stop-color:#4A250A"/>
                    <stop offset="100%" style="stop-color:#3D1E08"/>
                </linearGradient>

                <radialGradient id="ghostGradient" cx="50%" cy="30%" r="60%">
                    <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.8"/>
                    <stop offset="70%" style="stop-color:#F0E6D6;stop-opacity:0.4"/>
                    <stop offset="100%" style="stop-color:#E8DFD0;stop-opacity:0"/>
                </radialGradient>

                <linearGradient id="butterflyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#C4A35A;stop-opacity:0.7"/>
                    <stop offset="100%" style="stop-color:#8B6914;stop-opacity:0.5"/>
                </linearGradient>

                <radialGradient id="lanternGradient" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" style="stop-color:#FFD700;stop-opacity:0.6"/>
                    <stop offset="100%" style="stop-color:#8B2323;stop-opacity:0.4"/>
                </radialGradient>

                <linearGradient id="stoneGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#6B6B6B"/>
                    <stop offset="100%" style="stop-color:#4A4A4A"/>
                </linearGradient>

                <linearGradient id="pyroGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#FF6B35"/>
                    <stop offset="100%" style="stop-color:#8B2323"/>
                </linearGradient>

                <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur stdDeviation="4" result="blur"/>
                    <feMerge>
                        <feMergeNode in="blur"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>

                <filter id="watercolor" x="-20%" y="-20%" width="140%" height="140%">
                    <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="4" result="noise"/>
                    <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G"/>
                </filter>
            </defs>

            <g class="interior-world">
                <g class="world-elements">
                    <!-- 血月 -->
                    <g class="element blood-moon">
                        <circle cx="0" cy="0" r="28"/>
                        <path d="M-10,-5 L-5,5 L5,-5 L10,5 L-10,-5" fill="#1A1A1A" opacity="0.3"/>
                    </g>

                    <!-- 往生堂楼阁 -->
                    <g class="element wangsheng-temple" filter="url(#watercolor)">
                        <path d="M-50,50 L-55,0 L-45,-35 L-35,-30 L-25,-45 L-15,-35 L-5,-50 L5,-35 L15,-45 L25,-30 L35,-35 L45,0 L50,50 Z"/>
                        <path d="M-40,30 L-35,-10 L-25,-25 L-15,-15 L-5,-25 L5,-15 L15,-25 L25,-10 L30,30 L-40,30" fill="#3D1E08" opacity="0.8"/>
                        <rect x="-15" y="10" width="30" height="35" fill="#2D1706" opacity="0.9"/>
                        <circle cx="0" cy="0" r="3" class="glow"/>
                        <circle cx="-20" cy="20" r="2" class="glow"/>
                        <circle cx="20" cy="15" r="2" class="glow"/>
                    </g>

                    <!-- 胡桃人物 -->
                    <g class="element hutao-figure">
                        <ellipse cx="0" cy="-50" rx="12" ry="15" fill="#3D2817"/>
                        <path d="M-8,-35 Q0,-45 8,-35 L12,-10 Q0,-5 -12,-10 Z" fill="#8B2323"/>
                        <path d="M-10,-5 Q0,5 10,-5 L15,35 Q0,40 -15,35 Z" fill="#8B2323"/>
                        <path d="M-15,35 L-18,80" fill="none" stroke="#1A1A1A" stroke-width="3"/>
                        <path d="M15,35 L18,80" fill="none" stroke="#1A1A1A" stroke-width="3"/>
                        <circle cx="-18" cy="82" r="4" fill="#2D2020"/>
                        <circle cx="18" cy="82" r="4" fill="#2D2020"/>
                    </g>

                    <!-- 幽灵 -->
                    <g class="element ghost-spirit" filter="url(#softGlow)">
                        <ellipse cx="0" cy="0" rx="20" ry="25"/>
                        <path d="M-15,10 Q-8,5 -8,15" fill="none" stroke="#C4A35A" stroke-width="1.5" opacity="0.6"/>
                        <path d="M15,10 Q8,5 8,15" fill="none" stroke="#C4A35A" stroke-width="1.5" opacity="0.6"/>
                        <circle cx="-8" cy="-5" r="3" fill="#6B6B6B"/>
                        <circle cx="8" cy="-5" r="3" fill="#6B6B6B"/>
                        <path d="M-3,5 Q0,10 3,5" fill="none" stroke="#6B6B6B" stroke-width="2"/>
                        <path d="M-10,-20 L-8,-15 M10,-20 L8,-15" stroke="#C4A35A" stroke-width="2" opacity="0.5"/>
                    </g>

                    <!-- 彼岸花 -->
                    <g class="element spider-lilies">
                        <path d="M-80,0 C-85,-10 -90,-15 -88,-22 C-86,-28 -80,-26 -80,-22 C-80,-26 -74,-28 -72,-22 C-70,-15 -75,-10 -80,0" fill="#8B2323" opacity="0.8"/>
                        <path d="M-50,-5 C-53,-12 -56,-18 -54,-24 C-52,-29 -48,-27 -48,-23 C-48,-27 -44,-29 -42,-24 C-40,-18 -43,-12 -46,-5" fill="#A52A2A" opacity="0.7"/>
                        <path d="M-20,5 C-23,0 -26,-5 -24,-12 C-22,-18 -18,-16 -18,-12 C-18,-16 -14,-18 -12,-12 C-10,-5 -13,0 -16,5" fill="#8B2323" opacity="0.6"/>
                        <path d="M10,0 C13,-8 16,-14 14,-20 C12,-25 8,-23 8,-19 C8,-23 4,-25 2,-20 C0,-14 3,-8 6,0" fill="#A52A2A" opacity="0.7"/>
                        <path d="M40,-3 C43,-10 46,-16 44,-22 C42,-27 38,-25 38,-21 C38,-25 34,-27 32,-22 C30,-16 33,-10 36,-3" fill="#8B2323" opacity="0.8"/>
                        <path d="M70,5 C73,-2 76,-8 74,-14 C72,-19 68,-17 68,-13 C68,-17 64,-19 62,-14 C60,-8 63,-2 66,5" fill="#A52A2A" opacity="0.6"/>
                    </g>

                    <!-- 蝴蝶 -->
                    <g class="element butterfly-large">
                        <path d="M0,0 Q-12,-15 -8,-22 Q-4,-26 0,-18 Q4,-26 8,-22 Q12,-15 0,0"/>
                        <path d="M0,0 Q-8,-10 -5,-15 Q-2,-17 0,-12 Q2,-17 5,-15 Q8,-10 0,0" fill="#C4A35A" opacity="0.5"/>
                        <ellipse cx="0" cy="-6" rx="0.8" ry="5" fill="#2D1F15"/>
                        <circle cx="-2" cy="-3" r="1" fill="#D4AF37" opacity="0.6"/>
                        <circle cx="2" cy="-3" r="1" fill="#D4AF37" opacity="0.6"/>
                    </g>

                    <!-- 灯笼群 -->
                    <g class="element lanterns-group">
                        <g class="lantern-individual" style="left: 10%; top: 0%; animation-delay: 0s;">
                            <circle cx="0" cy="0" r="8"/>
                            <rect x="-1" y="-15" width="2" height="8" fill="#5D4E37"/>
                        </g>
                        <g class="lantern-individual" style="left: 30%; top: 10%; animation-delay: 1s;">
                            <circle cx="0" cy="0" r="6"/>
                            <rect x="-1" y="-12" width="2" height="6" fill="#5D4E37"/>
                        </g>
                        <g class="lantern-individual" style="left: 55%; top: 5%; animation-delay: 2s;">
                            <circle cx="0" cy="0" r="7"/>
                            <rect x="-1" y="-14" width="2" height="7" fill="#5D4E37"/>
                        </g>
                        <g class="lantern-individual" style="left: 75%; top: 15%; animation-delay: 0.5s;">
                            <circle cx="0" cy="0" r="5"/>
                            <rect x="-1" y="-10" width="2" height="5" fill="#5D4E37"/>
                        </g>
                    </g>

                    <!-- 墓碑 -->
                    <g class="element gravestone">
                        <rect x="-10" y="0" width="20" height="50" rx="2"/>
                        <rect x="-8" y="5" width="16" height="35" fill="#3D3D3D" opacity="0.6"/>
                        <path d="M-5,-15 L0,-25 L5,-15 Z" fill="#6B6B6B"/>
                        <text x="0" y="25" text-anchor="middle" fill="#C4A35A" font-size="6" font-family="Ma Shan Zheng">往生堂</text>
                    </g>

                    <!-- 钟离与胡桃剪影 -->
                    <g class="element figures-silhouette">
                        <path d="M20,60 L15,30 L20,20 L25,30 L20,60" fill="#2D2020"/>
                        <ellipse cx="20" cy="15" rx="6" ry="8" fill="#2D2020"/>
                        <path d="M45,55 L42,30 L45,22 L48,30 L45,55" fill="#2D2020"/>
                        <ellipse cx="45" cy="18" rx="5" ry="7" fill="#2D2020"/>
                        <path d="M35,60 L30,45 L35,40 L40,45 L35,60" fill="#2D2020"/>
                    </g>

                    <!-- 樱花 -->
                    <g class="element cherry-blossoms">
                        <g class="cherry-blossom" style="left: 10%; top: 0%; animation-delay: 0s;">
                            <circle cx="0" cy="0" r="4" fill="#FFB7C5" opacity="0.6"/>
                        </g>
                        <g class="cherry-blossom" style="left: 30%; top: 20%; animation-delay: 1.5s;">
                            <circle cx="0" cy="0" r="3" fill="#FFC0CB" opacity="0.5"/>
                        </g>
                        <g class="cherry-blossom" style="left: 50%; top: 10%; animation-delay: 3s;">
                            <circle cx="0" cy="0" r="3.5" fill="#FFB7C5" opacity="0.55"/>
                        </g>
                        <g class="cherry-blossom" style="left: 70%; top: 5%; animation-delay: 2s;">
                            <circle cx="0" cy="0" r="3" fill="#FFC0CB" opacity="0.6"/>
                        </g>
                    </g>
                </g>

                <!-- 余烬粒子 -->
                <g class="embers-container" id="emberContainer"></g>
            </g>

            <!-- 主体剪影 -->
            <path d="M200,30
                C260,35 320,80 340,150
                C355,220 345,290 325,350
                C310,390 290,430 260,470
                C230,500 200,520 200,530
                C200,520 170,500 140,470
                C110,430 90,390 75,350
                C55,290 45,220 60,150
                C80,80 140,35 200,30
                Z" fill="#1A1A1A" opacity="0.95"/>
        </svg>

        <div class="text-overlay">
            <div class="title-vertical">
                <h1>往生堂</h1>
                <div class="subtitle">七十五代堂主</div>
                <svg class="title-seal" viewBox="0 0 50 50">
                    <rect x="5" y="5" width="40" height="40" rx="2"/>
                    <text x="25" y="32" text-anchor="middle">胡桃</text>
                </svg>
            </div>

            <div class="poem-vertical">
                <p class="poem-text">
                    <span class="poem-line">生人未必能记住死者</span>
                    <span class="poem-line">但死人一定会记得生人</span>
                </p>
            </div>

            <div class="footer-info">
                <svg class="vision-icon" viewBox="0 0 40 40">
                    <circle cx="20" cy="20" r="18" fill="none" stroke="#FF6B35" stroke-width="2"/>
                    <circle cx="20" cy="20" r="10" fill="url(#pyroGradient)"/>
                    <path d="M20,8 L20,14 M20,26 L20,32 M8,20 L14,20 M26,20 L32,20" stroke="#FFFFFF" stroke-width="1.5" opacity="0.8"/>
                    <path d="M20,6 L20,8 M20,32 L20,34 M6,20 L8,20 M32,20 L34,20" stroke="#FF6B35" stroke-width="2"/>
                </svg>
                <div class="name">HU TAO</div>
                <div class="subname">LIYUE WANGSHENG FUNERAL PARLOR</div>
            </div>

            <svg class="footer-seal" viewBox="0 0 40 40">
                <rect x="4" y="4" width="32" height="32" rx="2"/>
                <text x="20" y="26" text-anchor="middle">胡</text>
            </svg>
        </div>

        <div class="brush-stroke-left"></div>
        <div class="brush-stroke-right"></div>
        <div class="vignette"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                document.getElementById('loading').classList.add('hidden');
            }, 2000);

            const emberContainer = document.getElementById('emberContainer');
            const emberCount = 30;

            for (let i = 0; i < emberCount; i++) {
                const ember = document.createElement('div');
                ember.className = 'ember';
                ember.style.left = `${25 + Math.random() * 50}%`;
                ember.style.top = `${50 + Math.random() * 40}%`;
                ember.style.animationDelay = `${Math.random() * 10}s`;
                ember.style.animationDuration = `${8 + Math.random() * 5}s`;
                ember.style.width = `${2 + Math.random() * 5}px`;
                ember.style.height = ember.style.width;
                emberContainer.appendChild(ember);
            }

            document.querySelectorAll('.element').forEach((el, i) => {
                el.style.animationDelay = `${0.3 + i * 0.35}s`;
            });
        });
    </script>
</body>
</html>
