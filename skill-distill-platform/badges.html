<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>成就徽章 - SkillDistill</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="badges.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">
                <div class="logo-icon">
                    <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M20 2L35 12V28L20 38L5 28V12L20 2Z" stroke="url(#logoGradient)" stroke-width="2" fill="none"/>
                        <path d="M20 8L28 14V26L20 32L12 26V14L20 8Z" fill="url(#logoGradient)" opacity="0.3"/>
                        <circle cx="20" cy="20" r="4" fill="url(#logoGradient)"/>
                        <defs>
                            <linearGradient id="logoGradient" x1="5" y1="2" x2="35" y2="38" gradientUnits="userSpaceOnUse">
                                <stop stop-color="#8b5cf6"/>
                                <stop offset="1" stop-color="#6366f1"/>
                            </linearGradient>
                        </defs>
                    </svg>
                </div>
                <span class="logo-text">SkillDistill</span>
            </a>
            
            <div class="nav-links" id="navLinks">
                <a href="index.html" class="nav-link">首页</a>
                <a href="index.html#levels" class="nav-link">分层体系</a>
                <a href="index.html#modules" class="nav-link">蒸馏模块</a>
                <a href="progress.html" class="nav-link">进度追踪</a>
                <a href="community.html" class="nav-link">社区</a>
                <a href="badges.html" class="nav-link active">成就</a>
            </div>
            
            <div class="nav-actions">
                <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="菜单">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Badges Header -->
    <section class="badges-header">
        <div class="container">
            <h1>成就徽章墙</h1>
            <p>完成学习目标，解锁专属成就。每一枚徽章都是你成长路上的里程碑</p>
        </div>
    </section>

    <!-- Achievement Summary -->
    <section class="achievement-summary">
        <div class="container">
            <div class="summary-grid">
                <div class="summary-card">
                    <div class="summary-icon">
                        <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
                            <circle cx="24" cy="24" r="20" stroke="url(#summaryGrad)" stroke-width="3"/>
                            <path d="M24 14V34M14 24H34" stroke="url(#summaryGrad)" stroke-width="3" stroke-linecap="round"/>
                            <defs>
                                <linearGradient id="summaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" stop-color="#8b5cf6"/>
                                    <stop offset="100%" stop-color="#6366f1"/>
                                </linearGradient>
                            </defs>
                        </svg>
                    </div>
                    <div class="summary-content">
                        <div class="summary-value" id="totalBadges">0</div>
                        <div class="summary-label">已获徽章</div>
                    </div>
                </div>
                
                <div class="summary-card">
                    <div class="summary-icon">
                        <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
                            <path d="M24 4L29 16L42 18L33 28L35 42L24 36L13 42L15 28L6 18L19 16L24 4Z" stroke="#fbbf24" stroke-width="3" fill="#fbbf24" fill-opacity="0.2"/>
                        </svg>
                    </div>
                    <div class="summary-content">
                        <div class="summary-value" id="totalPoints">0</div>
                        <div class="summary-label">总积分</div>
                    </div>
                </div>
                
                <div class="summary-card">
                    <div class="summary-icon">
                        <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
                            <circle cx="24" cy="24" r="20" stroke="#10b981" stroke-width="3"/>
                            <path d="M16 24L22 30L34 18" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <div class="summary-content">
                        <div class="summary-value" id="completionRate">0%</div>
                        <div class="summary-label">完成率</div>
                    </div>
                </div>
                
                <div class="summary-card">
                    <div class="summary-icon">
                        <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
                            <path d="M24 6V42M6 24H42" stroke="#ec4899" stroke-width="3" stroke-linecap="round"/>
                        </svg>
                    </div>
                    <div class="summary-content">
                        <div class="summary-value" id="remainingBadges">0</div>
                        <div class="summary-label">待解锁</div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Badges Grid -->
    <section class="badges-main">
        <div class="container">
            <div class="badges-tabs">
                <button class="badge-tab active" data-category="all">全部</button>
                <button class="badge-tab" data-category="learning">学习成就</button>
                <button class="badge-tab" data-category="streak">坚持成就</button>
                <button class="badge-tab" data-category="social">社区成就</button>
                <button class="badge-tab" data-category="special">特殊成就</button>
            </div>
            
            <div class="badges-grid" id="badgesGrid">
                <!-- Badges will be rendered dynamically -->
            </div>
        </div>
    </section>

    <!-- Achievement Tasks -->
    <section class="tasks-section">
        <div class="container">
            <h2>激励任务</h2>
            <p class="section-description">完成以下任务，解锁更多成就徽章</p>
            
            <div class="tasks-list" id="tasksList">
                <!-- Tasks will be rendered dynamically -->
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2024 SkillDistill. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <!-- Badge Detail Modal -->
    <div class="modal-overlay hidden" id="badgeModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="badgeModalTitle">徽章详情</h3>
                <button class="modal-close" id="closeBadgeModal">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                        <path d="M6 6L18 18M6 18L18 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </button>
            </div>
            <div class="modal-content" id="badgeModalContent">
            </div>
        </div>
    </div>

    <script src="badges.js"></script>
</body>
</html>
